[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academiciq-backend"
version = "1.0.0"
description = "AcademicIQ Evidence-Driven Academic Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.9",
    "celery==5.4.0",
    "redis==5.0.4",
    "flower==2.0.1",
    "PyMuPDF==1.24.3",
    "pdfplumber==0.11.0",
    "pytesseract==0.3.10",
    "Pillow==10.3.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",
    "shap==0.45.1",
    "httpx==0.27.0",
    "python-slugify==8.0.4",
    "structlog==24.1.0",
    "slowapi==0.1.9",
    "python-magic==0.4.27",
    "reportlab==4.2.0",
    "openpyxl==3.1.2",
    "jinja2==3.1.4",
    "cryptography==42.0.7",
    "passlib==1.7.4",
    "email-validator==2.1.1",
    "anyio==4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.0.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-python-jose==3.3.4.20240106",
    "types-passlib==1.7.7.20240327",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:cacheprovider"
