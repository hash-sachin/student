name: AcademicIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, type-check, test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: academiciq
          POSTGRES_PASSWORD: academiciq_test
          POSTGRES_DB: academiciq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libmagic1 libpq-dev gcc g++

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports
        continue-on-error: true  # type stubs may be incomplete at this phase

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://academiciq:academiciq_test@localhost:5432/academiciq_test
          DATABASE_URL_SYNC: postgresql+psycopg2://academiciq:academiciq_test@localhost:5432/academiciq_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          SECRET_KEY: test_secret_key_not_for_production
          ENVIRONMENT: development
          UPLOAD_DIR: /tmp/academiciq_uploads_test
        run: |
          mkdir -p /tmp/academiciq_uploads_test
          pytest tests/ -v --tb=short -x

  # ---------------------------------------------------------------------------
  # Frontend: lint, type-check, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (TypeScript / React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      - name: Run tests (Vitest)
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # ---------------------------------------------------------------------------
  # RBAC matrix test
  # ---------------------------------------------------------------------------
  rbac_matrix:
    name: RBAC Matrix Test
    runs-on: ubuntu-latest
    needs: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: academiciq
          POSTGRES_PASSWORD: academiciq_test
          POSTGRES_DB: academiciq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo apt-get install -y libpq-dev gcc tesseract-ocr libmagic1

      - run: pip install -e ".[dev]"

      - name: Run RBAC matrix tests
        env:
          DATABASE_URL: postgresql+asyncpg://academiciq:academiciq_test@localhost:5432/academiciq_test
          DATABASE_URL_SYNC: postgresql+psycopg2://academiciq:academiciq_test@localhost:5432/academiciq_test
          SECRET_KEY: test_secret_key_not_for_production
          ENVIRONMENT: development
          UPLOAD_DIR: /tmp/uploads_test
        run: pytest tests/rbac/ -v --tb=short
